<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICOM Viewer — CardioFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e5e5e5; font-family: sans-serif;
           display: flex; height: 100vh; overflow: hidden; }

    #series-sidebar {
      width: 120px; min-width: 120px; background: #141414;
      border-right: 1px solid #2a2a2a; overflow-y: auto;
      display: flex; flex-direction: column; gap: 4px; padding: 8px;
    }
    .series-thumb {
      cursor: pointer; border: 2px solid transparent; border-radius: 6px;
      padding: 4px; text-align: center; font-size: 11px; color: #999;
      transition: border-color .15s;
    }
    .series-thumb:hover  { border-color: #444; }
    .series-thumb.active { border-color: #6366f1; color: #c7d2fe; }
    .series-thumb img    { width: 100%; aspect-ratio: 1; object-fit: cover;
                           border-radius: 4px; background: #1e1e1e; display: block; }
    .series-thumb .count { display: block; font-size: 10px; color: #666; }

    #viewer-area {
      flex: 1; display: flex; flex-direction: column;  min-height: 0;
    }
    #toolbar {
      height: 40px; background: #111; border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
      font-size: 12px; color: #888;
    }
    #toolbar span { margin-right: 8px; }

    .toolbar-btn {
      padding: 2px 10px; background: #1e1e2e; color: #a5b4fc;
      border: 1px solid #3f3f5a; border-radius: 4px; cursor: pointer;
      font-size: 12px; line-height: 1.4;
    }
    .toolbar-btn:hover   { background: #27273d; }
    .toolbar-btn:active  { background: #32324a; }

    .zoom-control { display: flex; align-items: center; gap: 4px; margin-left: 4px; }
    .zoom-control .toolbar-btn { padding: 2px 9px; font-size: 14px; }
    #zoomValue { min-width: 38px; text-align: center; font-size: 11px; color: #888; }

    #viewport {
      flex: 1; background: #000;
      /* Cornerstone requires explicit dimensions on the element */
      width: 100%; height: 100%;
    }
    #instance-info { margin-left: auto; font-size: 11px; color: #555; }
  </style>
</head>
<body>
  <div id="series-sidebar"></div>
  <div id="viewer-area">
    <div id="toolbar">
      <span>Left click: W/L</span>
      <span>Right click / Ctrl+Scroll: Zoom</span>
      <span>Middle click: Pan</span>
      <span>Scroll: Slice</span>

      <button id="btnPlay" class="toolbar-btn" style="margin-left:8px;">▶ Play</button>

      <div class="cine-speed-control">
        <label for="fpsInput">Speed</label>
        <input type="range" id="fpsInput" min="1" max="30" value="10" step="1">
        <span id="fpsValue">10 fps</span>
      </div>

      <div class="zoom-control">
        <button id="btnZoomOut" class="toolbar-btn" title="Zoom out (Ctrl/Cmd −)">−</button>
        <span id="zoomValue">100%</span>
        <button id="btnZoomIn" class="toolbar-btn" title="Zoom in (Ctrl/Cmd +)">+</button>
        <button id="btnZoomReset" class="toolbar-btn" title="Reset zoom (Ctrl/Cmd 0)">Reset</button>
      </div>

      <span id="instance-info"></span>
    </div>
    <div id="viewport" style="width:100%;height:100vh;position:relative;background:#000;"></div>

  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
