<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CathLab Management System</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <nav class="topbar-breadcrumb">
                        <a href="#">Home</a><span>/</span><span>Dashboard</span>
                    </nav>
                </div>
                <div class="topbar-right">
                    <div class="topbar-user">
                        <div class="topbar-user-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                    </div>
                </div>
            </header>
            <div class="page-content">
                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-header-title">Dashboard</h1>
                        <p class="page-header-subtitle">Welcome back! Here's your overview.</p>
                    </div>
                </div>
                <!-- KPI Cards -->
                <div class="content-grid content-grid-cols-4" style="margin-bottom: var(--spacing-6);" id="kpiCards">
                    <div class="card stat-card stat-card-primary">
                        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                        <div class="stat-content"><div class="stat-value" id="totalPatients">-</div><div class="stat-label">Total Patients</div></div>
                    </div>
                    <div class="card stat-card stat-card-success">
                        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
                        <div class="stat-content"><div class="stat-value" id="studiesThisMonth">-</div><div class="stat-label">Studies This Month</div></div>
                    </div>
                    <div class="card stat-card stat-card-warning">
                        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
                        <div class="stat-content"><div class="stat-value" id="incompleteRecords">-</div><div class="stat-label">Incomplete Records</div></div>
                    </div>
                    <div class="card stat-card stat-card-danger">
                        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
                        <div class="stat-content"><div class="stat-value" id="lowStockAlerts">-</div><div class="stat-label">Low Stock Alerts</div></div>
                    </div>
                </div>
                <!-- Content Grid -->
                <div class="content-grid" style="grid-template-columns: 2fr 1fr;">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Recent Studies</h3><span class="card-subtitle">Last 10 procedures</span></div>
                        <div class="table-container">
                            <table class="table"><thead><tr><th>Patient</th><th>Accession #</th><th>Date</th><th>Status</th><th>Operator</th></tr></thead><tbody id="recentStudiesBody"></tbody></table>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Incomplete Records</h3><span class="card-subtitle">Requires attention</span></div>
                        <div class="card-body" style="padding: 0;"><div class="incomplete-list" id="incompletePatientsList"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="loading-overlay" id="loadingOverlay" style="display: none;"><div style="text-align: center;"><div class="spinner spinner-lg"></div><p class="loading-text">Loading dashboard...</p></div></div>
    <script type="module">
        import { renderSidebar } from '../../assets/js/components/sidebar.js';
        import { showToast } from '../../assets/js/components/toast.js';
        import { getPatients } from '../../assets/js/api/patients.js';
        import { formatDate, formatStatusBadge, showEmptyState } from '../../assets/js/utils.js';

        if (!sessionStorage.getItem('authToken')) window.location.href = '/frontend/pages/login.html';
        renderSidebar('sidebar-container');

        async function initDashboard() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex';
            try {
                await Promise.all([loadKPIs(), loadRecentStudies(), loadIncompletePatients()]);
            } catch (error) { showToast.error('Failed to load dashboard data. ' + error.message); }
            finally { loadingOverlay.style.display = 'none'; }
        }

        async function loadKPIs() {
            try {
                const patientsData = await getPatients({ page: 1, pageSize: 1 });
                const totalPatients = patientsData.totalCount || patientsData.total || patientsData.items?.length || 0;
                document.getElementById('totalPatients').textContent = totalPatients;
                let incompleteCount = 0;
                try {
                    const allPatients = await getPatients({ page: 1, pageSize: 100, status: 'incomplete' });
                    incompleteCount = allPatients.totalCount || allPatients.total || allPatients.items?.length || 0;
                } catch { if (patientsData.items) incompleteCount = patientsData.items.filter(p => p.isIncomplete).length; }
                document.getElementById('incompleteRecords').textContent = incompleteCount;
                document.getElementById('studiesThisMonth').textContent = '-';
                document.getElementById('lowStockAlerts').textContent = '-';
            } catch (error) { throw error; }
        }

        async function loadRecentStudies() {
            const tbody = document.getElementById('recentStudiesBody');
            try {
                const patientsData = await getPatients({ page: 1, pageSize: 10, sortBy: 'updatedAt', sortDir: 'desc' });
                const patients = patientsData.items || patientsData.patients || [];
                if (patients.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="table-empty"><p>No recent studies found</p></td></tr>'; return; }
                tbody.innerHTML = patients.map(p => `<tr class="clickable ${p.isIncomplete ? 'row-highlight' : ''}" onclick="window.location.href='/frontend/pages/patients/detail.html?id=${p.id}'"><td><div style="font-weight:500;">${escapeHtml(p.fullName)}</div><div style="font-size:12px;color:#6b7280;">${escapeHtml(p.conquestPatientID || p.nationalId || '-')}</div></td><td>-</td><td>${formatDate(p.updatedAt)}</td><td>${formatStatusBadge(p.isIncomplete)}</td><td>-</td></tr>`).join('');
            } catch { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ef4444;">Failed to load recent studies</td></tr>'; }
        }

        async function loadIncompletePatients() {
            const container = document.getElementById('incompletePatientsList');
            try {
                const patientsData = await getPatients({ page: 1, pageSize: 10, status: 'incomplete' });
                const patients = patientsData.items || patientsData.patients || [];
                if (patients.length === 0) { showEmptyState(container, 'No incomplete records', 'check'); return; }
                container.innerHTML = patients.map(p => `<div class="list-item" onclick="window.location.href='/frontend/pages/patients/detail.html?id=${p.id}'"><div class="list-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="list-item-content"><div class="list-item-title">${escapeHtml(p.fullName)}</div><div class="list-item-subtitle">${escapeHtml(p.conquestPatientID || p.nationalId || 'No ID')}</div></div><span class="badge badge-warning">!</span></div>`).join('');
            } catch { container.innerHTML = '<p style="text-align:center;color:#6b7280;">Failed to load incomplete records</p>'; }
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        initDashboard();
    </script>
</body>
</html>
