<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CathLab Management System</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <style>
        .login-password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-gray-400); cursor: pointer; padding: 4px; }
        .login-password-toggle:hover { color: var(--color-gray-600); }
        .form-group-password { position: relative; }
        .form-group-password .form-control { padding-right: 44px; }
        .login-error { background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: var(--radius); padding: var(--spacing-3) var(--spacing-4); margin-bottom: var(--spacing-4); color: var(--color-danger); font-size: var(--font-size-sm); display: none; }
        .login-error.show { display: block; }
    </style>
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="login-title">CathLab</h1>
            <p class="login-subtitle">Cardiac Catheterization Laboratory Management</p>
        </div>
        <div class="login-body">
            <div class="login-error" id="loginError"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="form-group-password">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="login-password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeOffIcon" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <div class="spinner spinner-sm" id="loginSpinner" style="display:none;"></div>
                </button>
            </form>
        </div>
        <div class="login-footer">
            <p class="text-muted" style="font-size: var(--font-size-xs); margin: 0;">CathLab Management System v1.0</p>
        </div>
    </div>
    <script type="module">
        import { showToast } from '../assets/js/components/toast.js';
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            eyeIcon.style.display = type === 'password' ? 'block' : 'none';
            eyeOffIcon.style.display = type === 'password' ? 'none' : 'block';
        });

        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', () => loginError.classList.remove('show'));
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const Username = document.getElementById('username').value.trim();
            const Password = passwordInput.value;
            if (!Username || !Password) { loginError.textContent = 'Please enter both username and Password.'; loginError.classList.add('show'); return; }
            loginBtn.disabled = true;
            loginBtnText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';
            try {
    const response = await fetch('http://localhost:5152/api/Auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ Username, Password })
    });

    if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.message || 'Invalid username or password.');
    }
    // petit helper pour décoder le payload d'un JWT (pas besoin de librairie)
    function decodeJwtPayload(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
            atob(base64).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
        );
        return JSON.parse(jsonPayload);
    }

    const result = await response.json();
sessionStorage.setItem('authToken', result.token);

const payload = decodeJwtPayload(result.token);
sessionStorage.setItem('user', JSON.stringify({
    id: payload.nameid,                                    // claim "nameid" = ClaimTypes.NameIdentifier
    username: result.username,
    fullName: result.fullName,
    role: payload.role || payload[Object.keys(payload).find(k => k.endsWith('/role'))]
}));

showToast('Login successful! Redirecting...', 'success');
setTimeout(() => window.location.href = '/frontend/pages/dashboard/index.html', 1000);
} catch (error) {
    loginError.textContent = error.message || 'Login failed. Please try again.';
    loginError.classList.add('show');
}
            finally {
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        });

        if (sessionStorage.getItem('authToken')) window.location.href = '/frontend/pages/dashboard/index.html';
    </script>
</body>
</html>
